name: dep-audit

# Continuous dependency-vulnerability audit.
#
# Gate scope = what SHIPS. Whisper Guard has no runtime dependencies
# (package.json "dependencies": {}); the published extension is a self-contained
# esbuild bundle of our own source plus a Public Suffix List snapshot, so the
# artifact users install and the stores review carries ZERO npm advisories. The
# only devDependency chain with open advisories is web-ext (Mozilla's own Firefox
# build/lint tool) and its transitive deps (shell-quote, brace-expansion,
# addons-linter, fx-runner, ...) - they run at build time on our own machines,
# are never shipped, and web-ext has no patched release to move to.
#
# So the BLOCKING gate audits shipped (production) deps only and must stay 0
# HIGH/CRITICAL. A second, non-blocking step still surfaces the full tree
# (incl. dev tooling) for visibility - nothing is hidden, but dev-only tooling
# advisories do not block a release of an artifact that provably contains none
# of them. Accepted 2026-07-26 as a documented dev-only exception.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # BLOCKING: the shipped extension tree must have 0 HIGH/CRITICAL.
      - name: Audit shipped dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      # Visibility: surface the full tree incl. dev tooling; never hidden, non-blocking.
      - name: Audit full tree incl. dev tooling (informational)
        run: npm audit --audit-level=high || true
